<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a100c">
  <link rel="icon" href="data:,">
  <title>一路相随的图书馆 · 浙江大学西迁校史展</title>
  <link rel="preload" href="fonts/brush.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/print.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/desk.css">
  <link rel="stylesheet" href="css/pieces/bombs.css">
  <link rel="stylesheet" href="css/pieces/jianggongci.css">
  <link rel="stylesheet" href="css/pieces/longquan.css">
  <link rel="stylesheet" href="css/narration.css">
  <link rel="stylesheet" href="css/credits.css">
  <style>
    /* 加载页：内联，样式表和脚本未到时也能显示；底色与海报一致，交接时无缝 */
    .loader { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: #e8dcc3; color: #1c1915;
      font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Songti SC', serif; transition: opacity .8s cubic-bezier(.2,.7,.2,1), visibility 0s .8s; }
    .loader.done { opacity: 0; visibility: hidden; }
    .loader::before { content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(120,90,40,.14), transparent 55%); }
    .ld-inner { position: relative; width: min(460px, 100%); text-align: center; }
    .ld-k { margin: 0; font-size: 13px; letter-spacing: .4em; color: #7a6448; }
    .ld-title { margin: 14px 0 28px; font-size: clamp(26px, 8vw, 40px); letter-spacing: .18em; line-height: 1.2; white-space: nowrap; }
    .ld-bar, .ld-msg { width: min(320px, 100%); margin-left: auto; margin-right: auto; }
    .ld-bar { position: relative; height: 1px; background: rgba(28,25,21,.18); overflow: hidden; }
    .ld-bar i { position: absolute; inset: 0 auto 0 0; width: calc(var(--k, .04) * 100%); background: #b4391f; transition: width .6s cubic-bezier(.2,.7,.2,1);
      animation: ld-creep 8s cubic-bezier(.1,.6,.3,1) forwards; }
    @keyframes ld-creep { from { min-width: 0; } to { min-width: 12%; } }
    .ld-msg { margin: 14px 0 0; font-size: 14px; letter-spacing: .12em; color: #6c665a; min-height: 1.6em; }
    .ld-slow, .ld-inner noscript { display: block; margin: 18px auto 0; max-width: 300px; font-size: 13px; line-height: 1.7; color: #8a4a2c; }
    .ld-slow[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .ld-bar i { transition: none; animation: none; } }
    /* 海报出现后展厅仍在后台搭建：推门按钮底边一道细光随贴图加载走满 */
    .pz-enter[disabled] { cursor: progress; }
    .pz-enter[disabled]::after { content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: calc(var(--prep, 0) * 100%); background: #ffd9a2; opacity: .85; transition: width .4s; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body data-mode="loading">
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="ld-inner">
      <p class="ld-k">浙江大学西迁校史展</p>
      <p class="ld-title">一路相随的图书馆</p>
      <div class="ld-bar" aria-hidden="true"><i></i></div>
      <p class="ld-msg">正在打开展厅的门……</p>
      <p class="ld-slow" hidden></p>
      <noscript>需要开启浏览器的 JavaScript 才能参观本展。</noscript>
    </div>
  </div>
  <script>
    (function () {
      var slow = document.querySelector('.ld-slow');
      function say(t) { if (document.getElementById('loader')) { slow.textContent = t; slow.hidden = false; } }
      if (location.protocol === 'file:') say('请通过网址（http）打开本展，直接双击文件无法载入展厅。');
      setTimeout(function () { say('网络较慢，展品还在路上，请稍候。若长时间停在这里，请用最新版 Chrome、Safari 或 Edge 打开。'); }, 12000);
      var noGL = '这台设备或浏览器没有开启 3D 图形（WebGL），展厅无法显示。请换用最新版 Chrome、Safari 或 Edge，并在设置中打开“硬件加速”。';
      try { var c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) say(noGL); } catch (e) { say(noGL); }
      addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') say('有文件没能载入，请刷新页面再试。');
        else if (/WebGL/i.test(e.message || '')) say(noGL);
      }, true);
    })();
  </script>
  <div id="stage"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 入口海报（poster.js 填充） -->
  <section id="entry" class="poster" aria-label="展览海报"></section>

  <!-- 展厅界面 -->
  <section id="hud" class="hud">
    <header class="hud-top">
      <span class="hud-title" id="hudTitle"></span>
      <button class="tracker" id="tracker" type="button" aria-expanded="false" aria-controls="taskList" aria-label="任务：待点亮的展品"></button>
    </header>
    <div class="markers" id="markers"></div>
    <section class="task-list" id="taskList" aria-label="四件展品的任务灯" hidden></section>
    <nav class="chapters" id="chapters" aria-label="章节"></nav>
    <article class="card" id="card" aria-live="polite"></article>
    <aside class="note" id="note" aria-live="polite"></aside>
    <p class="hud-hint">拖动浏览 · 点画框看展品 · 滚轮或双指缩放</p>
  </section>

  <section id="brief" class="brief" role="dialog" aria-label="任务信"></section>
  <section id="ceremony" class="ceremony" aria-live="polite"></section>
  <section id="siteUI" class="site-ui"></section>
  <section id="archive" class="archive"></section>
  <div id="fade" class="fade"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    const query = new URLSearchParams(location.search);
    if (query.has('autoplay') || (query.has('alllit') && query.has('skip'))) import('./js/autoplay.js');
  </script>
</body>
</html>
